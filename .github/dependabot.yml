# @format

version: 2

registries:
  docker:
    type: docker-registry
    url: dhi.io
    username: ${{ secrets.DOCKER_USERNAME }}
    password: ${{ secrets.DOCKER_PASSWORD }}

updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '12:49'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: devcontainers
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '12:49'
    groups:
      devcontainer-features:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '12:49'
    groups:
      docker-images:
        patterns:
          - '*'
    registries:
      - docker

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '12:49'
    groups:
      npm-dependencies:
        patterns:
          - '*'
    versioning-strategy: increase
    labels:
      - dependencies
