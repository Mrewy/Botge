# @format

version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '12:49'
      timezone: Europe/Budapest
    groups:
      github-action-versions:
        patterns:
          - '*'
    assignees:
      - 'Mrewy'

  - package-ecosystem: devcontainers
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '12:49'
      timezone: Europe/Budapest
    groups:
      devcontainer-feature-versions:
        patterns:
          - '*'
    assignees:
      - 'Mrewy'

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '12:49'
      timezone: Europe/Budapest
    groups:
      npm-dependencies:
        patterns:
          - '*'
    assignees:
      - 'Mrewy'
