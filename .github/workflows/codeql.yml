# @format

name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - '**/*.ts'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
      - '**/*.ts'
  schedule:
    - cron: '49 12 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      # packages: read

    strategy:
      matrix:
        include:
          - language: typescript
          - language: actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Paths filter
        id: changes
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            actions:
              - '.github/workflows/*.yml'
            typescript:
              - '**/*.ts'

      - name: Initialize CodeQL
        if: github.event_name == 'schedule' || steps.changes.outputs[matrix.language] == 'true'
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries:
            ${{ matrix.language == 'typescript' &&
            './.github/codeql/queries/typescript-security-and-quality.qls' || 'security-and-quality'
            }}

      - name: CodeQL Analysis
        if: github.event_name == 'schedule' || steps.changes.outputs[matrix.language] == 'true'
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: '/language:${{ matrix.language }}'
