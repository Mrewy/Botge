# @format

name: Docker Hub Cleanup
on:
  schedule:
    - cron: '49 12 * * 1'
  workflow_dispatch:

jobs:
  cleanup:
    name: Docker Hub cleanup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Docker Hub cleanup
        uses: lostlink/docker-cleanup@v1.0.1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repositories: 'botge'
          dry-run: false
