# @format

name: Publish Docker Image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-docker-image.yml'
      - 'src/**'
      - '.dockerignore'
      - 'Dockerfile'
      - 'Dockerfile.rego'
      - 'LICENSE.txt'
      - 'node.config.json'
      - 'package-lock.json'
      - 'package.json'
  workflow_dispatch:

jobs:
  build:
    name: Build
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    with:
      output: image
      context: .
      push: true

      meta-images: mrewy/botge
      meta-tags: |
        type=raw,value=latest

      set-meta-annotations: true
      set-meta-labels: true
      sbom: true

      platforms: linux/amd64,linux/arm64
      setup-qemu: true

      cache: true
      cache-mode: max

    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
