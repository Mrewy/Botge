# documentation.

name: Publish Docker Image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-docker-image.yml'
      - 'src/**'
      - '.dockerignore'
      - 'Dockerfile'
      - 'LICENSE.txt'
      - 'node.config.json'
      - 'package-lock.json'
      - 'package.json'
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest

    permissions:
      contents: read
      attestations: write
      id-token: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          version: latest

      - name: Validate build configuration
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          call: check

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: mrewy/botge
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Generate artifact attestation
        uses: actions/attest@v4.2.2
        with:
          subject-name: index.docker.io/mrewy/botge
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
