# @format

name: Regal Lint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regal-lint.yml'
      - '.regal/config.yaml'
      - '**/*.rego'
  pull_request:
    paths:
      - '.github/workflows/regal-lint.yml'
      - '.regal/config.yaml'
      - '**/*.rego'

jobs:
  regal-lint:
    name: Regal lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Regal
        uses: open-policy-agent/setup-regal@v2.0.0
        with:
          version: latest

      - name: Regal lint
        run: regal lint . --format github
