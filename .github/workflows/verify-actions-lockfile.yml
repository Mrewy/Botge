# @format

# Fails when .github/workflows/actions.lock is out of sync with the
# workflows or a locked pin no longer verifies upstream.

name: Verify Actions Lockfile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions.lock'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/actions.lock'
      - '.github/workflows/*.yml'

jobs:
  verify:
    name: Verify lockfile
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock
      - run: gh actions-lock --verify
